[package]
name = "piet-common"
version.workspace = true
description = "Selection of a single preferred backend for Piet."
categories = ["rendering::graphics-api"]
keywords = ["graphics", "2d"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-pc-windows-msvc"
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown"
    ]

[features]
default = ["native"]

# Native platform backends. This is enabled by default to preserve the
# historical behavior of `piet-common`.
native = [
    "dep:piet-cairo",
    "dep:cairo-rs",
    "dep:cairo-sys-rs",
    "dep:piet-coregraphics",
    "dep:core-graphics",
    "dep:piet-direct2d",
    "dep:piet-web",
    "dep:wasm-bindgen",
    "dep:web-sys",
]

# Terminal backend. Disable default features when selecting this backend to
# avoid pulling in the native GUI dependencies.
tui = ["dep:piet-tui", "dep:ratatui-core"]
tui-big-text = ["tui", "piet-tui/big-text"]

# passing on all the image features. AVIF is not supported because it does not
# support decoding, and that's all we use `Image` for.
image = ["piet/image"]
image_png = ["piet/image_png"]
jpeg = ["piet/jpeg"]
gif = ["piet/gif"]
bmp = ["piet/bmp"]
ico = ["piet/ico"]
tiff = ["piet/tiff"]
webp = ["piet/webp"]
pnm = ["piet/pnm"]
dds = ["piet/dds"]
tga = ["piet/tga"]
hdr = ["piet/hdr"]

serde = ["piet/serde"]

[dependencies]
piet = { workspace = true }
piet-tui = { workspace = true, optional = true }
cfg-if = "1.0.4"
png = { version = "0.18.1", optional = true }
ratatui-core = { version = "0.1.2", features = ["std"], optional = true }

[target.'cfg(any(target_os="linux", target_os="openbsd", target_os="freebsd", target_os="netbsd"))'.dependencies]
piet-cairo = { workspace = true, optional = true }
cairo-rs = { version = "0.22.0", default-features = false, optional = true }
cairo-sys-rs = { version = "0.22.0", optional = true }

[target.'cfg(any(target_os="macos", target_os="ios"))'.dependencies]
piet-coregraphics = { workspace = true, optional = true }
core-graphics = { version = "0.24.0", optional = true }

[target.'cfg(target_os="windows")'.dependencies]
piet-direct2d = { workspace = true, optional = true }

[target.'cfg(target_arch="wasm32")'.dependencies]
piet-web = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2.118", optional = true }

[target.'cfg(target_arch="wasm32")'.dev-dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
wasm-bindgen-test = "0.3.68"

[target.'cfg(target_arch="wasm32")'.dependencies.web-sys]
version = "0.3.95"
optional = true
features = [
    "console",
    "Window",
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "CanvasWindingRule",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageBitmap",
    "ImageData",
    "TextMetrics",
]

[dev-dependencies]
static_assertions = "1.1.0"
rand = "0.8.6"
rand_distr = "0.4.3"
